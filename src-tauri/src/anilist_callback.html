<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>Anisaki · AniList</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0e19;color:#efe9dc;font:16px/1.5 system-ui,sans-serif}
main{max-width:420px;padding:32px;text-align:center}.seal{display:inline-grid;place-items:center;width:52px;height:52px;border:2px solid #e2b254;border-radius:8px;color:#e2b254;font:900 28px serif;transform:rotate(-5deg);margin-bottom:16px}
h1{font:700 1.5rem Georgia,serif;margin:0 0 8px}p{color:#9b98a8;margin:0}</style></head><body><main><div class="seal">咲</div><h1 id="t">Bağlanıyor…</h1><p id="m">Bir saniye.</p>
<script>
const p = new URLSearchParams(location.hash.slice(1));
const token = p.get('access_token');
const t = document.getElementById('t'), m = document.getElementById('m');
if (!token) { t.textContent = 'Giriş tamamlanmadı'; m.textContent = p.get('error_description') || 'AniList bir anahtar göndermedi. Uygulamadan tekrar dene.'; }
else fetch('/anilist/token', { method: 'POST', body: token }).then(r => {
  if (!r.ok) throw 0;
  history.replaceState(null, '', location.pathname);
  t.textContent = 'AniList bağlandı';
  m.textContent = 'Bu sekmeyi kapatıp Anisaki’ye dönebilirsin.';
}).catch(() => { t.textContent = 'Uygulamaya ulaşılamadı'; m.textContent = 'Anisaki açık mı? Uygulamadan tekrar dene.'; });
</script></main></body></html>
